<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer - Subscribe Now</title>
    <style>
        /* Pengaturan Dasar & Latar Belakang */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px 20px;
            width: 100%;
        }

        /* Label Sale */
        .sale-badge {
            display: inline-block;
            border: 1px solid #ffffff;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Bagian Harga (Kuning Emas) */
        .price-section {
            color: #f2a900;
            margin-bottom: 20px;
        }

        .price-original {
            font-size: 36px;
            font-weight: 800;
            text-decoration: line-through;
            margin-bottom: -15px;
            display: inline-block;
        }

        .price-main {
            font-size: 130px;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            letter-spacing: -3px;
        }

        /* Teks Judul (Font Serif Klasik) */
        .headline {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 42px;
            font-weight: normal;
            margin: 20px 0 10px;
            line-height: 1.2;
        }

        .subhead {
            font-size: 20px;
            margin-bottom: 35px;
        }

        /* Tombol CTA Utama */
        .cta-button {
            background-color: #f4f4f4;
            color: #111;
            border: none;
            border-radius: 50px;
            padding: 18px 20px;
            width: 100%;
            max-width: 450px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .cta-button:hover {
            background-color: #ffffff;
        }

        .btn-main-text {
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        .btn-main-text s {
            color: #666;
            font-weight: normal;
        }

        .btn-sub-text {
            font-size: 14px;
            color: #555;
            font-weight: normal;
        }

        /* Teks Syarat & Ketentuan (Kecil di bawah tombol) */
        .disclaimer {
            font-size: 13px;
            color: #cccccc;
            margin: 15px auto 40px;
            max-width: 480px;
            line-height: 1.5;
            font-weight: bold;
        }

        /* Tautan Login */
        .login-link {
            font-size: 16px;
        }

        .login-link a {
            color: #ffffff;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 480px) {
            .price-main { font-size: 100px; }
            .headline { font-size: 32px; }
            .subhead { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Label Atas -->
        <div class="sale-badge">Sale</div>

        <!-- Harga Coret dan Harga Diskon -->
        <div class="price-section">
            <div class="price-original"><s>$90 USD</s></div>
            <div class="price-main">$20</div>
        </div>

        <!-- Teks Utama -->
        <h1 class="headline">A smarter season starts now.</h1>
        <p class="subhead">Save on your first year of The Post.</p>

        <!-- Tombol Aksi -->
        <button class="cta-button" id="btnContinue">
            <span class="btn-main-text">Subscribe for <s>$90 USD</s> $20</span>
            <span class="btn-sub-text">for the first year</span>
        </button>

        <!-- Keterangan Kecil -->
        <p class="disclaimer">After first year, renews at $90 USD/year. Pricing subject to change. Cancel anytime.</p>

        <!-- Tautan Login Bawah -->
        <p class="login-link">
            Already have an account? <a id="btnCancel">Sign Up</a>
        </p>
    </div>

    <!-- SCRIPT ARBITRASE (PELACAK ZONE ID UNTUK MONETAG OMG10) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Menangkap ID situs dari URL GitHub Anda (dikirim oleh PopAds)
            const urlParams = new URLSearchParams(window.location.search);
            const popadsSiteID = urlParams.get('siteid') || 'organic_traffic';
            
            // 2. Link Monetag Baru Anda
            let MONETAG_LINK = "https://omg10.com/4/11754740";
            
            // 3. Tambahkan parameter pelacakan ?var= dengan ID yang ditangkap
            MONETAG_LINK += "?var=" + popadsSiteID;
            
            // 4. Fungsi eksekusi pengalihan
            function forceRedirect(e) {
                e.preventDefault(); 
                window.location.href = MONETAG_LINK; 
            }
            
            // 5. Pasang fungsi ke Tombol "Subscribe" dan "Sign In"
            const btnContinue = document.getElementById('btnContinue');
            const btnCancel = document.getElementById('btnCancel');
            
            if (btnContinue) btnContinue.addEventListener('click', forceRedirect);
            if (btnCancel) btnCancel.addEventListener('click', forceRedirect);
        });
    </script>

</body>
</html>
